name: Deploy producer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'DEPLOYMENT.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GCP_VM_KNOWN_HOSTS }}
          VM_IP: ${{ secrets.GCP_VM_IP || vars.GCP_VM_IP }}
          VM_HOST: ${{ secrets.GCP_VM_HOST || vars.GCP_VM_HOST }}
          VM_PORT: ${{ vars.GCP_VM_SSH_PORT || '22' }}
        run: |
          TARGET="${VM_IP:-$VM_HOST}"
          test -n "$TARGET" || { echo 'Set repository variable GCP_VM_HOST or GCP_VM_IP'; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          ssh-keyscan -p "$VM_PORT" -H "$TARGET" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$VM_HOST" ] && [ -n "$VM_IP" ] && [ "$VM_HOST" != "$VM_IP" ]; then
            ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            printf 'Host %s\n  HostName %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' "$VM_HOST" "$VM_IP" "$VM_PORT" >> ~/.ssh/config
            chmod 600 ~/.ssh/config
          fi

      - name: Sync producer files to VM
        env:
          VM_IP: ${{ secrets.GCP_VM_IP || vars.GCP_VM_IP }}
          VM_HOST: ${{ secrets.GCP_VM_HOST || vars.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER || vars.GCP_VM_USER }}
          VM_PORT: ${{ vars.GCP_VM_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.PRODUCER_DEPLOY_PATH || '/home/' }}
          GCP_PUBSUB_KEY: ${{ secrets.GCP_PUBSUB_KEY }}
        run: |
          TARGET="${VM_IP:-$VM_HOST}"
          test -n "$TARGET" || { echo 'Set repository variable GCP_VM_HOST or GCP_VM_IP'; exit 1; }
          test -n "$VM_USER" || { echo 'Set repository variable GCP_VM_USER'; exit 1; }
          if [ "$DEPLOY_PATH" = '/home/' ]; then DEPLOY_PATH="/home/$VM_USER/apps/neo-tel-signal-producer"; fi
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" -o StrictHostKeyChecking=accept-new "$VM_USER@$TARGET" "mkdir -p '$DEPLOY_PATH'"
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$TARGET" 'if ! command -v rsync >/dev/null 2>&1; then if command -v apt-get >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y rsync; elif command -v dnf >/dev/null 2>&1; then sudo dnf install -y rsync; elif command -v yum >/dev/null 2>&1; then sudo yum install -y rsync; else echo "No supported package manager found to install rsync" >&2; exit 1; fi; fi'
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' --include='.env.example' --exclude='.env.*' \
            --exclude='.venv/' --exclude='venv/' \
            --exclude='*.session' --exclude='*.session-*' \
            --exclude='logs/' --exclude='*.log' \
            --exclude='*.json' \
            -e "ssh -i ~/.ssh/deploy_key -p $VM_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$VM_USER@$TARGET:$DEPLOY_PATH/"
          if [ -n "$GCP_PUBSUB_KEY" ]; then
            echo "Deploying GCP Pub/Sub service account key to $TARGET:$DEPLOY_PATH/gcp-pubsub-key.json..."
            printf '%s\n' "$GCP_PUBSUB_KEY" | ssh -i ~/.ssh/deploy_key -p "$VM_PORT" -o StrictHostKeyChecking=accept-new "$VM_USER@$TARGET" \
              "cat > '$DEPLOY_PATH/gcp-pubsub-key.json' && chmod 600 '$DEPLOY_PATH/gcp-pubsub-key.json'"
            echo "Key successfully provisioned."
          fi

      - name: Deploy producer service
        env:
          VM_IP: ${{ secrets.GCP_VM_IP || vars.GCP_VM_IP }}
          VM_HOST: ${{ secrets.GCP_VM_HOST || vars.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER || vars.GCP_VM_USER }}
          VM_PORT: ${{ vars.GCP_VM_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.PRODUCER_DEPLOY_PATH || '/home/' }}
          LOG_CLEANUP_CRON: ${{ secrets.LOG_CLEANUP_CRON_PRODUCER || vars.LOG_CLEANUP_CRON_PRODUCER || secrets.LOG_CLEANUP_CRON || vars.LOG_CLEANUP_CRON || '0 8 * * *' }}
        run: |
          TARGET="${VM_IP:-$VM_HOST}"
          if [ "$DEPLOY_PATH" = '/home/' ]; then DEPLOY_PATH="/home/$VM_USER/apps/neo-tel-signal-producer"; fi
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" -o StrictHostKeyChecking=accept-new "$VM_USER@$TARGET" \
            "DEPLOY_PATH='$DEPLOY_PATH' LOG_CLEANUP_CRON='$LOG_CLEANUP_CRON' bash '$DEPLOY_PATH/deploy/deploy.sh'"
